name: Enable tested patch updates
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
permissions:
  contents: write
  pull-requests: write
jobs:
  enable:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.base.ref == 'main' && vars.AUTO_MERGE_PATCHES == 'true'
    runs-on: ubuntu-latest
    steps:
      # This privileged workflow never checks out or executes pull-request code.
      - uses: dependabot/fetch-metadata@v3
        id: metadata
      - name: Enable auto-merge only with the verification check required
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ secrets.DEPENDENCY_MERGE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo 'Set DEPENDENCY_MERGE_TOKEN to enable patch merges that trigger main CI.'
            exit 0
          fi
          required=$(gh api "repos/$GH_REPO/branches/main/protection/required_status_checks" --jq '.contexts[]' 2>/dev/null || true)
          if echo "$required" | grep -qx 'verify'; then
            gh pr merge "$PR_NUMBER" --auto --squash --repo "$GH_REPO"
          else
            echo 'Automatic merge stays disabled until main requires the verify check.'
          fi
