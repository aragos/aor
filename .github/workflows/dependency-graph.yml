name: JVM dependency graph
on:
  push:
    branches: [main]
  schedule:
    - cron: '43 7 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/dependency-submission@v5
        with:
          dependency-graph: generate-and-submit
          dependency-resolution-task: ':server:dependencies'
