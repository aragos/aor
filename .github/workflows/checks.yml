name: Checks
on:
  push:
    branches: [main, release]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'
permissions:
  contents: read
concurrency:
  group: >-
    checks-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    && 'refs/heads/release' || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      commit: ${{ steps.revision.outputs.commit }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Scheduled workflows run on main; refreshes must verify the selected release.
          ref: >-
            ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
            && 'refs/heads/release' || github.sha }}
      - name: Record the commit under verification
        id: revision
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Configure isolated PostgreSQL endpoint
        env:
          POSTGRES_TEST_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          echo "AOR_TEST_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:$POSTGRES_TEST_PORT/postgres?sslmode=disable" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: ./gradlew :core:jvmTest :core:compileKotlinJs :server:test checkKotlinFormat
      - run: npm test --workspace web
      - run: npm run build
      - run: npm audit --audit-level=low
      - name: Production container
        run: docker build --pull -t aor:verify .
      - name: Production container with PostgreSQL
        run: python3 scripts/check-container.py
      - name: Browser interactions
        run: npm run test:browser --workspace web
        env:
          CHROME_BIN: /usr/bin/google-chrome
          AOR_BROWSER_SERVER: ${{ github.workspace }}/web/scripts/postgres-browser-server.sh
      - name: Live undo and history
        run: npm run test:browser --workspace web
        env:
          CHROME_BIN: /usr/bin/google-chrome
          AOR_BROWSER_SUITE: history.browser.mjs
          AOR_BROWSER_SERVER: ${{ github.workspace }}/web/scripts/postgres-browser-server.sh
  refresh-runtime:
    if: >-
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release') &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.commit }}
      - name: Rebuild the deployed service with fresh base images
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          VERIFIED_COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo 'Set RENDER_API_KEY and RENDER_SERVICE_ID to enable weekly runtime refreshes.'
            exit 0
          fi
          release_commit=$(git ls-remote --exit-code origin refs/heads/release | cut -f1)
          if [ "$release_commit" != "$VERIFIED_COMMIT" ]; then
            echo 'Release changed after verification; skipping this runtime refresh.'
            exit 0
          fi
          curl --fail --silent --show-error --request POST \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header 'Content-Type: application/json' \
            --data "{\"clearCache\":\"clear\",\"commitId\":\"$VERIFIED_COMMIT\"}" > /dev/null
