name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'
permissions:
  contents: read
concurrency:
  group: >-
    checks-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    && 'refs/heads/release' || github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    # Cold Kotlin compilation and the broad browser suite share one checkout.
    timeout-minutes: 45
    outputs:
      commit: ${{ steps.revision.outputs.commit }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Scheduled workflows run on main; refreshes must verify the selected release.
          ref: >-
            ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
            && 'refs/heads/release' || github.sha }}
      - name: Record the commit under verification
        id: revision
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Configure isolated PostgreSQL endpoint
        env:
          POSTGRES_TEST_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          echo "AOR_TEST_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:$POSTGRES_TEST_PORT/postgres?sslmode=disable" >> "$GITHUB_ENV"
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-provider: basic
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: >-
          ./gradlew :core:jvmTest :core:compileKotlinJs :core:jsNodeTest :core:jsBrowserTest
          :ai:jvmTest :ai:jsNodeTest :ai:jsBrowserTest :ai:jsBrowserProductionLibraryDistribution
          :training:test :server:test checkKotlinFormat
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Independent geometry and public option catalogs
        run: |
          python3 -m pip install -r web/scripts/map-requirements.txt
          ./gradlew :server:exportMapCatalog -Pmap=standard -PmapOutput=/tmp/aor-standard.json
          ./gradlew :server:exportMapCatalog -Pmap=european -PmapOutput=/tmp/aor-european.json
          python3 web/scripts/validate-map.py --catalog /tmp/aor-standard.json
          python3 web/scripts/validate-map.py --catalog /tmp/aor-european.json --geometry web/src/map/europeanBoardGeometry.json
          ./gradlew :server:exportRuleOptions -PruleOptionsOutput=/tmp/aor-rule-options.json
          diff web/src/ruleOptions.json /tmp/aor-rule-options.json
      - run: npm test --workspace web
      # The parallel container job builds and typechecks the production client.
      - run: npm audit --audit-level=low
      - name: Browser interactions
        run: >-
          npm run test:browser --workspace web -- home.browser.mjs map.browser.mjs
          history.browser.mjs bots.browser.mjs gameResults.browser.mjs themeContrast.browser.mjs
        env:
          CHROME_BIN: /usr/bin/google-chrome
          AOR_BROWSER_TIMEOUT_MS: '600000'
          AOR_BROWSER_SERVER: ${{ github.workspace }}/web/scripts/postgres-browser-server.sh
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: >-
            ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
            && 'refs/heads/release' || github.sha }}
      - name: Record the commit under verification
        id: revision
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Python tools
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Production container (includes web build and typecheck)
        run: docker build --pull -t aor:verify .
      - name: Production container with PostgreSQL
        env:
          POSTGRES_TEST_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          export AOR_TEST_DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:$POSTGRES_TEST_PORT/postgres?sslmode=disable"
          python3 scripts/check-container.py
    outputs:
      commit: ${{ steps.revision.outputs.commit }}
  verify:
    # Keep the required check stable, and fail closed if either job fails or is skipped.
    if: always()
    needs: [source, container]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ needs.source.outputs.commit }}
    steps:
      - name: Require all checks on the same commit
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
          CONTAINER_COMMIT: ${{ needs.container.outputs.commit }}
        run: |
          test "$SOURCE_RESULT" = success
          test "$CONTAINER_RESULT" = success
          test -n "$SOURCE_COMMIT"
          test "$SOURCE_COMMIT" = "$CONTAINER_COMMIT"
  refresh-runtime:
    if: >-
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release') &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.commit }}
      - name: Rebuild the deployed service with fresh base images
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          VERIFIED_COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo 'Set RENDER_API_KEY and RENDER_SERVICE_ID to enable weekly runtime refreshes.'
            exit 0
          fi
          release_commit=$(git ls-remote --exit-code origin refs/heads/release | cut -f1)
          if [ "$release_commit" != "$VERIFIED_COMMIT" ]; then
            echo 'Release changed after verification; skipping this runtime refresh.'
            exit 0
          fi
          curl --fail --silent --show-error --request POST \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header 'Content-Type: application/json' \
            --data "{\"clearCache\":\"clear\",\"commitId\":\"$VERIFIED_COMMIT\"}" > /dev/null
