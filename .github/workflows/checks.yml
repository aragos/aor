name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: ./gradlew :core:jvmTest :core:compileKotlinJs :server:test checkKotlinFormat
      - run: npm test --workspace web
      - run: npm run build
      - run: npm audit --audit-level=low
      - name: Browser interactions
        run: npm run test:browser --workspace web
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: Live undo and history
        run: npm run test:browser --workspace web
        env:
          CHROME_BIN: /usr/bin/google-chrome
          AOR_BROWSER_SUITE: history.browser.mjs
      - name: Production container
        run: docker build --pull -t aor:verify .
  refresh-runtime:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild the deployed service with fresh base images
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          VERIFIED_COMMIT: ${{ github.sha }}
        run: |
          if [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID" ]; then
            curl --fail --silent --show-error --request POST \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              --header 'Content-Type: application/json' \
              --data "{\"clearCache\":\"clear\",\"commitId\":\"$VERIFIED_COMMIT\"}" > /dev/null
          else
            echo 'Set RENDER_API_KEY and RENDER_SERVICE_ID to enable weekly runtime refreshes.'
          fi
