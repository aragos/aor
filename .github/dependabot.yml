version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    groups:
      compatible-updates:
        update-types: [minor, patch]
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: daily
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Skip EOL runtime lines; leave maintained major upgrades available.
    ignore:
      - dependency-name: eclipse-temurin
        versions: ["~> 22.0", "~> 23.0", "~> 24.0", "~> 26.0"]
      - dependency-name: node
        versions: ["~> 25.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
