version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    groups:
      compatible-updates:
        update-types: [minor, patch]
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: daily
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Java 24 and Node 25 are EOL; leave supported major upgrades available.
    ignore:
      - dependency-name: eclipse-temurin
        versions: ["~> 24.0"]
      - dependency-name: node
        versions: ["~> 25.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
