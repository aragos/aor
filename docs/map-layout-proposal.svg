<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Age of Renaissance — proposed readable map layout</title>
  <desc id="desc">Static design study of a regional map focused on Venice. All eight land neighbors, two coastal neighbors and two supporting satellites are shown. Province values and these connections follow the repository catalog. Only Venice's incident connections are drawn. Occupancy is illustrative. The inspector repeats connection types in text. Controls illustrate a proposed interface and are not interactive.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #243d35; }
      .muted { fill: #52675f; }
      .small { font-size: 14px; }
      .meta { font-size: 12px; font-weight: 650; letter-spacing: .6px; }
      .name { font-size: 18px; font-weight: 700; }
      .body { font-size: 16px; }
      .number { font-size: 29px; font-weight: 750; text-anchor: middle; }
      .land { fill: none; stroke: #58675f; stroke-width: 2.5; }
      .coast { fill: none; stroke: #176f9a; stroke-width: 4; stroke-dasharray: 10 6; }
      .support { fill: none; stroke: #775397; stroke-width: 2.5; marker-end: url(#arrow); }
      .card { fill: #fffef9; stroke: #b5bfb1; stroke-width: 1.5; }
      .market { fill: #e9eddf; }
      .separator { stroke: #dce0d5; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#775397"/>
    </marker>
    <g id="cloth"><path d="M0 1 H16 V13 H0 Z M3 1 V13 M7 1 V13 M11 1 V13 M0 5 H16 M0 9 H16" stroke="#75525e" fill="#f0e2e6" stroke-width="1"/></g>
    <g id="stone"><path d="M0 7 L5 1 H13 L17 8 L13 14 H3 Z M5 1 L7 8 L3 14 M7 8 H17" fill="#e7e4da" stroke="#6a675e" stroke-width="1.2"/></g>
    <g id="timber"><path d="M8 0 L2 7 H5 L0 13 H6 V17 H10 V13 H16 L11 7 H14 Z" fill="#456746"/></g>
    <g id="anchor"><circle cx="8" cy="3" r="2" fill="none" stroke="#176f9a" stroke-width="1.6"/><path d="M8 5 V17 M3 8 H13 M1 12 Q1 17 8 17 Q15 17 15 12 M0 14 L1 11 L4 13 M12 13 L15 11 L16 14" fill="none" stroke="#176f9a" stroke-width="1.6"/></g>
  </defs>
  <rect width="1600" height="1120" fill="#f3f0e8"/>
  <text x="32" y="40" class="meta muted">AGE OF RENAISSANCE / MAP DESIGN STUDY</text>
  <text x="32" y="80" font-size="30" font-weight="650">A readable board, one region at a time</text>
  <text x="1568" y="76" text-anchor="end" class="small muted">Regional focus · static proposal · sample pieces</text>

  <!-- Map workspace and proposed navigation. -->
  <rect x="32" y="110" width="1116" height="800" rx="12" fill="#f8f7ef" stroke="#d3dacd"/>
  <path d="M44 110 H1136 Q1148 110 1148 122 V195 H32 V122 Q32 110 44 110" fill="#fffef9"/>
  <rect x="52" y="130" width="250" height="44" rx="6" fill="#f5f5ec" stroke="#c6cdbf"/>
  <text x="68" y="157" class="body muted">Find province or commodity</text>
  <rect x="316" y="130" width="162" height="44" rx="6" fill="#f5f5ec" stroke="#c6cdbf"/>
  <text x="332" y="157" class="body">All areas ▾</text>
  <rect x="492" y="130" width="174" height="44" rx="6" fill="#264c3e"/>
  <text x="508" y="157" font-size="16" style="fill:#fffef9">Connections: all ▾</text>
  <rect x="856" y="130" width="92" height="44" rx="6" fill="#f5f5ec" stroke="#c6cdbf"/>
  <text x="902" y="157" text-anchor="middle" class="body">Overview</text>
  <rect x="960" y="130" width="168" height="44" rx="6" fill="#f5f5ec" stroke="#c6cdbf"/>
  <text x="981" y="157" class="body">−</text><text x="1044" y="157" text-anchor="middle" class="body">100%</text><text x="1101" y="157" class="body">+</text>
  <line x1="32" y1="195" x2="1148" y2="195" class="separator"/>
  <text x="54" y="222" class="small muted">Italy &amp; the Alps</text>
  <text x="1126" y="222" text-anchor="end" class="small muted">Selected: Venice · connections shown only for this province</text>

  <!-- Quiet geographic context; it conveys orientation, never adjacency. -->
  <path d="M700 625 Q800 610 849 683 L812 810 Q740 880 690 884 H650 Q660 790 700 625" fill="#e1edf0"/>
  <text x="724" y="820" font-size="14" fill="#376c7e" transform="rotate(-63 724 820)">ADRIATIC SEA</text>
  <text x="70" y="425" class="meta muted">ALPINE PROVINCES · AREA III</text>
  <text x="70" y="665" class="meta muted">ITALIAN MARKETS · AREA VII</text>

  <!-- Complete selected-province topology, transcribed from BoardConnectionData. -->
  <g aria-label="Venice land borders">
    <path class="land" d="M298 384 L478 470"/>
    <path class="land" d="M535 359 L548 470"/>
    <path class="land" d="M805 379 L646 470"/>
    <path class="land" d="M275 535 H455"/>
    <path class="land" d="M860 535 H665"/>
    <path class="land" d="M292 720 L483 594"/>
    <path class="land" d="M546 735 L550 594"/>
    <path class="land" d="M825 730 L650 594"/>
  </g>
  <g aria-label="Venice coastal connections">
    <path class="coast" d="M591 594 L591 735"/>
    <path class="coast" d="M665 571 Q764 602 802 673 L825 752"/>
    <circle cx="591" cy="594" r="5" fill="#fffef9" stroke="#176f9a" stroke-width="2"/>
    <circle cx="591" cy="735" r="5" fill="#fffef9" stroke="#176f9a" stroke-width="2"/>
  </g>
  <g aria-label="Satellite support toward Venice">
    <path class="support" d="M250 384 Q301 452 454 492"/>
    <path class="support" d="M586 359 Q626 409 610 466"/>
  </g>
  <rect x="565" y="645" width="131" height="30" rx="15" fill="#fffef9" stroke="#b9d3df"/>
  <text x="630" y="665" text-anchor="middle" font-size="14" style="fill:#176f9a">1 coastal step</text>

  <!-- Fixed card anatomy: area/coast, name, commodity + market, pieces. -->
  <g transform="translate(100 260)">
    <rect width="210" height="124" rx="8" class="card"/>
    <text x="14" y="21" class="meta muted">III · INLAND</text>
    <text x="14" y="47" class="name">St. Gall</text>
    <text x="14" y="75" class="small">No commodity</text>
    <rect x="154" y="42" width="40" height="40" rx="3" class="market"/>
    <text x="174" y="73" class="number">1</text>
    <text x="174" y="96" text-anchor="middle" font-size="10" class="muted">MARKET</text>
    <text x="14" y="111" class="small muted">Satellite · empty</text>
  </g>
  <g transform="translate(430 235)">
    <rect width="210" height="124" rx="8" class="card"/>
    <text x="14" y="21" class="meta muted">III · INLAND</text>
    <text x="14" y="47" class="name">Salzburg</text>
    <text x="14" y="75" class="small">No commodity</text>
    <rect x="154" y="42" width="40" height="40" rx="3" class="market"/>
    <text x="174" y="73" class="number">1</text>
    <text x="174" y="96" text-anchor="middle" font-size="10" class="muted">MARKET</text>
    <text x="14" y="111" class="small muted">Satellite · empty</text>
  </g>
  <g transform="translate(805 255)">
    <rect width="210" height="124" rx="8" class="card"/>
    <text x="14" y="21" class="meta muted">III · INLAND</text>
    <text x="14" y="47" class="name">Vienna</text>
    <use href="#stone" x="14" y="62"/><text x="38" y="75" class="body">Stone</text>
    <circle cx="174" cy="62" r="23" class="market"/>
    <text x="174" y="73" class="number">4</text>
    <text x="174" y="99" text-anchor="middle" font-size="10" class="muted">MARKET</text>
    <text x="14" y="111" class="small muted">Empty</text>
  </g>
  <g transform="translate(65 475)">
    <rect width="210" height="124" rx="8" class="card"/>
    <text x="14" y="21" class="meta muted">VII · INLAND</text>
    <text x="14" y="47" class="name">Milan</text>
    <use href="#stone" x="14" y="62"/><text x="38" y="75" class="body">Stone</text>
    <circle cx="174" cy="62" r="23" class="market"/>
    <text x="174" y="73" class="number">3</text>
    <text x="174" y="99" text-anchor="middle" font-size="10" class="muted">MARKET</text>
    <text x="14" y="111" class="small muted">Empty</text>
  </g>
  <g transform="translate(455 470)">
    <rect x="-5" y="-5" width="220" height="134" rx="12" fill="none" stroke="#264c3e" stroke-width="3"/>
    <rect width="210" height="124" rx="8" fill="#fffef9" stroke="#264c3e" stroke-width="1.5"/>
    <text x="14" y="21" class="meta muted">VII · COASTAL</text><use href="#anchor" x="178" y="7"/>
    <text x="14" y="47" class="name">Venice ★</text>
    <use href="#cloth" x="14" y="63"/><text x="38" y="75" class="body">Cloth</text>
    <circle cx="174" cy="62" r="23" fill="#264c3e"/>
    <text x="174" y="73" class="number" style="fill:#fffef9">5</text>
    <text x="174" y="99" text-anchor="middle" font-size="10" class="muted">MARKET</text>
    <circle cx="20" cy="106" r="6" fill="#87543c"/>
    <text x="33" y="111" class="small">P1 · marker</text>
  </g>
  <g transform="translate(860 475)">
    <rect width="210" height="124" rx="8" class="card"/>
    <text x="14" y="21" class="meta muted">III · INLAND</text>
    <text x="14" y="47" class="name">Esseg</text>
    <text x="14" y="75" class="small">No commodity</text>
    <rect x="154" y="42" width="40" height="40" rx="3" class="market"/>
    <text x="174" y="73" class="number">1</text>
    <text x="174" y="96" text-anchor="middle" font-size="10" class="muted">MARKET</text>
    <text x="14" y="111" class="small muted">Satellite · empty</text>
  </g>
  <g transform="translate(95 720)">
    <rect width="210" height="124" rx="8" class="card"/>
    <text x="14" y="21" class="meta muted">VII · COASTAL</text><use href="#anchor" x="178" y="7"/>
    <text x="14" y="47" class="name">Genoa ★</text>
    <use href="#cloth" x="14" y="63"/><text x="38" y="75" class="body">Cloth</text>
    <circle cx="174" cy="62" r="23" class="market"/>
    <text x="174" y="73" class="number">5</text>
    <text x="174" y="99" text-anchor="middle" font-size="10" class="muted">MARKET</text>
    <text x="14" y="111" class="small muted">Empty</text>
  </g>
  <g transform="translate(445 735)">
    <rect width="210" height="124" rx="8" class="card"/>
    <text x="14" y="21" class="meta muted">VII · COASTAL</text><use href="#anchor" x="178" y="7"/>
    <text x="14" y="47" class="name">Florence</text>
    <use href="#cloth" x="14" y="63"/><text x="38" y="75" class="body">Cloth</text>
    <circle cx="174" cy="62" r="23" class="market"/>
    <text x="174" y="73" class="number">4</text>
    <text x="174" y="99" text-anchor="middle" font-size="10" class="muted">MARKET</text>
    <rect x="14" y="101" width="10" height="10" fill="#87543c"/>
    <text x="32" y="111" class="small">P1 · 2 old + 1 new</text>
  </g>
  <g transform="translate(825 715)">
    <rect width="210" height="124" rx="8" class="card"/>
    <text x="14" y="21" class="meta muted">VII · COASTAL</text><use href="#anchor" x="178" y="7"/>
    <text x="14" y="47" class="name">Dubrovnik</text>
    <use href="#timber" x="14" y="60"/><text x="38" y="75" class="body">Timber</text>
    <circle cx="174" cy="62" r="23" class="market"/>
    <text x="174" y="73" class="number">3</text>
    <text x="174" y="99" text-anchor="middle" font-size="10" class="muted">MARKET</text>
    <text x="14" y="111" class="small muted">Empty</text>
  </g>
  <text x="54" y="889" class="small muted">Full names, commodities and market numbers remain visible at the reading zoom.</text>

  <!-- Persistent inspector with explicit, independently typed relationships. -->
  <rect x="1172" y="110" width="396" height="800" rx="12" fill="#fffef9" stroke="#d3dacd"/>
  <text x="1196" y="146" class="meta muted">PROVINCE DETAILS</text>
  <text x="1196" y="183" font-size="28" font-weight="650">Venice ★</text>
  <text x="1196" y="212" class="body muted">Area VII · capital · coastal</text>
  <line x1="1196" y1="234" x2="1544" y2="234" class="separator"/>
  <text x="1196" y="263" class="small muted">MARKET SIZE</text><text x="1390" y="263" class="small muted">COMMODITY</text>
  <text x="1196" y="304" font-size="34" font-weight="700">5</text>
  <use href="#cloth" x="1390" y="283"/><text x="1416" y="305" font-size="24">Cloth</text>
  <text x="1196" y="342" class="body">● P1 marker · established</text>
  <text x="1196" y="370" class="small muted">Access requirement: none</text>
  <line x1="1196" y1="391" x2="1544" y2="391" class="separator"/>
  <path d="M1196 423 H1228" class="land"/>
  <text x="1240" y="428" class="body" font-weight="650">Land neighbors · 8</text>
  <text x="1196" y="458" class="body">St. Gall, Salzburg, Vienna, Esseg,</text>
  <text x="1196" y="484" class="body">Milan, Genoa, Florence, Dubrovnik</text>
  <path d="M1196 523 H1228" class="coast"/>
  <text x="1240" y="528" class="body" font-weight="650">Coastal neighbors · 2</text>
  <text x="1196" y="558" class="body">Florence, Dubrovnik</text>
  <text x="1196" y="584" class="small muted">One step to each adjacent coastal space.</text>
  <path d="M1196 619 H1227" class="support"/>
  <text x="1240" y="624" class="body" font-weight="650">Supporting satellites · 2</text>
  <text x="1196" y="654" class="body">St. Gall → Venice</text>
  <text x="1196" y="680" class="body">Salzburg → Venice</text>
  <rect x="1196" y="708" width="348" height="82" rx="6" fill="#e9f0f2"/>
  <text x="1210" y="733" class="body" font-weight="650">Sea access · Adriatic Sea</text>
  <text x="1210" y="758" class="small">Sea membership is a separate relationship;</text>
  <text x="1210" y="778" class="small">sharing a sea does not imply coastal adjacency.</text>
  <line x1="1196" y1="812" x2="1544" y2="812" class="separator"/>
  <text x="1196" y="841" class="small muted">Select a neighbor to follow its connections.</text>
  <text x="1196" y="867" class="small muted">Route eligibility appears here during expansion.</text>
  <text x="1196" y="890" font-size="12" class="muted">Static facts above; game-dependent status below.</text>

  <!-- Permanent legend and design principles. -->
  <rect x="32" y="930" width="1536" height="66" rx="10" fill="#fffef9" stroke="#d3dacd"/>
  <path d="M54 962 H96" class="land"/><text x="108" y="967" class="body">Land border</text>
  <path d="M279 962 H321" class="coast"/><text x="333" y="967" class="body">Coastal step</text>
  <path d="M504 962 H546" class="support"/><text x="558" y="967" class="body">Satellite → market</text>
  <use href="#anchor" x="785" y="951"/><text x="812" y="967" class="body">Coastal province</text>
  <text x="1023" y="967" class="body">★ Capital</text>
  <rect x="1150" y="953" width="15" height="15" fill="#87543c"/><text x="1177" y="967" class="body">Tokens</text>
  <circle cx="1310" cy="961" r="8" fill="#87543c"/><text x="1331" y="967" class="body">Domination marker</text>
  <text x="32" y="1035" font-size="17" font-weight="700">01 / Stable labels</text>
  <text x="32" y="1062" class="body muted">Separate space for values and player pieces.</text>
  <text x="555" y="1035" font-size="17" font-weight="700">02 / Explicit topology</text>
  <text x="555" y="1062" class="body muted">Position suggests geography; lines define connections.</text>
  <text x="1110" y="1035" font-size="17" font-weight="700">03 / Read at a useful scale</text>
  <text x="1110" y="1062" class="body muted">Pan and zoom instead of shrinking every label.</text>
  <text x="32" y="1098" font-size="12" class="muted">Illustrative regional composition, not a full-board placement plan. Values and selected topology: repository province and connection catalogs.</text>
</svg>
