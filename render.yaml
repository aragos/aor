services:
  - type: web
    name: aor
    runtime: docker
    plan: 0.5c-512mb
    region: virginia
    branch: release
    numInstances: 1
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    envVars:
      - key: AOR_STORAGE
        value: postgres
      - key: AOR_DATABASE_URL
        fromDatabase:
          name: aor-postgres
          property: connectionString
      - key: AOR_DATABASE_TLS
        value: require
      - key: AOR_DATABASE_POOL_SIZE
        value: '4'
      - key: AOR_AUTH_MODE
        value: firebase
      - key: AOR_HTTP_HOST
        value: 0.0.0.0
      - key: AOR_GAME_CREATION_POLICY
        value: approved
      - key: AOR_FIREBASE_PROJECT_ID
        sync: false
      - key: AOR_FIREBASE_WEB_API_KEY
        sync: false
      - key: AOR_ADMIN_UIDS
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/firebase-admin.json

databases:
  - name: aor-postgres
    plan: 0.1c-256mb
    region: virginia
    postgresMajorVersion: '18'
    diskSizeGB: 1
    ipAllowList: []
