[versions]
kotlin = "2.4.21"
ktor = "3.6.1"
logback = "1.6.6"
jackson = "2.22.4"
ktfmt = "0.64"
truth = "1.4.5"
collectionsImmutable = "0.5.2"
firebaseAdmin = "9.11.0"
guava = "33.7.2-jre"
opentelemetry = "1.67.0"
postgresql = "42.7.14"
hikari = "7.1.0"
flyway = "13.12.0"
embeddedPostgres = "2.2.2"
postgresBinaries = "18.6.0"

[libraries]
guava = { module = "com.google.guava:guava", version.ref = "guava" }
opentelemetry-bom = { module = "io.opentelemetry:opentelemetry-bom", version.ref = "opentelemetry" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
embedded-postgres = { module = "io.zonky.test:embedded-postgres", version.ref = "embeddedPostgres" }
postgres-binaries = { module = "io.zonky.test.postgres:embedded-postgres-binaries-bom", version.ref = "postgresBinaries" }
postgres-darwin-arm = { module = "io.zonky.test.postgres:embedded-postgres-binaries-darwin-arm64v8", version.ref = "postgresBinaries" }
firebase-admin = { module = "com.google.firebase:firebase-admin", version.ref = "firebaseAdmin" }
ktor-serverBodyLimit = { module = "io.ktor:ktor-server-body-limit-jvm", version.ref = "ktor" }
ktor-serverCompression = { module = "io.ktor:ktor-server-compression-jvm", version.ref = "ktor" }
ktor-serverDefaultHeaders = { module = "io.ktor:ktor-server-default-headers-jvm", version.ref = "ktor" }
collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "collectionsImmutable" }
ktfmt = { module = "com.facebook:ktfmt", version.ref = "ktfmt" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
logback = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
ktor-serverCore = { module = "io.ktor:ktor-server-core-jvm", version.ref = "ktor" }
ktor-serverNetty = { module = "io.ktor:ktor-server-netty-jvm", version.ref = "ktor" }
ktor-serverTestHost = { module = "io.ktor:ktor-server-test-host-jvm", version.ref = "ktor" }

[plugins]
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
